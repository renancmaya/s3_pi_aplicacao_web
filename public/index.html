<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Controle de Despesas</h1>

    <div class="container">
        <h2>Adicionar Registro</h2>
        <form id="form">
            <input type="hidden" id="id">
            <div>
                <label for="description">Descrição</label>
                <input type="text" id="description" required>
            </div>
            <div>
                <label for="type">Tipo</label>
                <select id="type" required>
                    <option value="">Selecione...</option>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>
            </div>
            <div>
                <label for="category">Categoria</label>
                <input type="text" id="category" required>
            </div>
            <div>
                <label for="due-date">Data</label>
                <input type="date" id="due-date" required>
            </div>
            <div>
                <label for="value">Valor (R$)</label>
                <input type="number" id="value" step="0.01" min="0.01" required>
            </div>
            <div class="full-width">
                <button type="submit" id="submit">Salvar Registro</button>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="clear" class="form__clear"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path></svg>
        </form>
    </div>

    <div class="container">
        <h2>Histórico</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Tipo</th>
                    <th>Categoria</th>
                    <th>Data</th>
                    <th>Valor</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- O JavaScript injetará as linhas (tr) e células (td) aqui -->
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="5">Total Acumulado</th>
                    <th id="total-cell">R$ 0,00</th>
                </tr>
            </tfoot>
        </table>
    </div>

    <script src="mockData.js"></script>
    <script src="script.js"></script>
</body>
</html>
