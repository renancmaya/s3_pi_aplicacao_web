<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador Financeiro</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body class="page">

    <h1 class="page__title">Controle de Despesas</h1>

    <!-- Formulário de adição e edição -->
    <section class="container section section--add">
        <h2 class="section__heading">Adicionar Registro</h2>

        <form id="form" class="form form--add add">
            <input type="hidden" id="id">

            <div class="form__input-group">
                <label for="status" class="form__label">Status</label>
                <select id="status" class="form__input form__input--select" required>
                    <option value="">Selecione...</option>
                </select>
            </div>

            <div class="form__input-group">
                <label for="description" class="form__label">Descrição</label>
                <input type="text" id="description" class="form__input" required>
            </div>

            <div class="form__input-group">
                <label for="type" class="form__label">Tipo</label>
                <select id="type" class="form__input form__input--select" required>
                    <option value="">Selecione...</option>
                </select>
            </div>

            <div class="form__input-group">
                <label for="category" class="form__label">Categoria</label>
                <select id="category" class="form__input form__input--select" required>
                    <option value="">Selecione...</option>
                </select>
            </div>

            <div class="form__input-group">
                <label for="due-date" class="form__label">Data</label>
                <input type="date" id="due-date" class="form__input" required>
            </div>

            <div class="form__input-group">
                <label for="value" class="form__label">Valor (R$)</label>
                <input type="number" id="value" class="form__input" step="0.01" required>
            </div>

            <div class="form__actions full-width">
                <button type="submit" id="submit" class="form__button">
                    Adicionar registro
                </button>
            </div>

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="clear" class="form__clear">
                <path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path>
            </svg>
        </form>
    </section>

    <!-- Barra de filtros -->
    <section class="container section section--filters">
        <form id="filter-form" class="form form--filters filters">

            <div class="filters__field">
                <label for="filter-status" class="form__label">Status</label>
                <select id="filter-status" class="form__input form__input--select">
                    <option value="">Todas</option>
                </select>
            </div>

            <div class="filters__field">
                <label for="filter-description" class="form__label">Buscar descrição</label>
                <input type="text" id="filter-description" class="form__input" placeholder="">
            </div>

            <div class="filters__field">
                <label for="filter-type" class="form__label">Tipo</label>
                <select id="filter-type" class="form__input form__input--select">
                    <option value="">Todos</option>
                </select>
            </div>

            <div class="filters__field">
                <label for="filter-category" class="form__label">Categoria</label>
                <select id="filter-category" class="form__input form__input--select">
                    <option value="">Todas</option>
                </select>
            </div>

            <div class="filters__field filters__field--date-range">
                <label for="filter-due-date-min" class="form__label">Data inicial</label>
                <input type="date" id="filter-due-date-min" class="form__input" placeholder="">

                <label for="filter-due-date-max" class="form__label">Data final</label>
                <input type="date" id="filter-due-date-max" class="form__input" placeholder="">
            </div>

            <div class="filters__field filters__field--value-range">
                <label for="filter-value-min" class="form__label">Valor mínimo</label>
                <input type="text" id="filter-value-min" class="form__input" placeholder="">

                <label for="filter-value-max" class="form__label">Valor Máximo</label>
                <input type="text" id="filter-value-max" class="form__input" placeholder="">
            </div>

            <div class="filters__actions">
                <input type="submit" id="filter-submit-btn" class="button filters__submit-button" value="Aplicar filtros">
                <button id="filter-clear-btn" class="filter__clear filters__clear-button">Limpar</button>
            </div>

        </form>
    </section>

    <!-- Tabela de registros -->
    <section class="container section section--history">
        <h2 class="section__heading">Histórico</h2>

        <table class="table">
            <thead id="table-head" class="table__head">
                <tr class="table__row">

                    <!-- <th class="table__header">ID</th> -->

                    <th class="table__header" aria-sort="none">
                        Status
                        <button data-sort="status" class="table__sort-button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="table__sort-icon">
                                <path d="M12 15.0006L7.75732 10.758L9.17154 9.34375L12 12.1722L14.8284 9.34375L16.2426 10.758L12 15.0006Z"></path>
                            </svg>
                        </button>
                    </th>

                    <th class="table__header" aria-sort="none">
                        Descrição
                        <button data-sort="description" class="table__sort-button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="table__sort-icon">
                                <path d="M12 15.0006L7.75732 10.758L9.17154 9.34375L12 12.1722L14.8284 9.34375L16.2426 10.758L12 15.0006Z"></path>
                            </svg>
                        </button>
                    </th>

                    <th class="table__header" aria-sort="none">
                        Tipo
                        <button data-sort="type" class="table__sort-button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="table__sort-icon">
                                <path d="M12 15.0006L7.75732 10.758L9.17154 9.34375L12 12.1722L14.8284 9.34375L16.2426 10.758L12 15.0006Z"></path>
                            </svg>
                        </button>
                    </th>

                    <th class="table__header" aria-sort="none">
                        Categoria
                        <button data-sort="category" class="table__sort-button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="table__sort-icon">
                                <path d="M12 15.0006L7.75732 10.758L9.17154 9.34375L12 12.1722L14.8284 9.34375L16.2426 10.758L12 15.0006Z"></path>
                            </svg>
                        </button>
                    </th>

                    <th class="table__header" aria-sort="none">
                        Data
                        <button data-sort="dueDate" class="table__sort-button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="table__sort-icon">
                                <path d="M12 15.0006L7.75732 10.758L9.17154 9.34375L12 12.1722L14.8284 9.34375L16.2426 10.758L12 15.0006Z"></path>
                            </svg>
                        </button>
                    </th>

                    <th class="table__header" aria-sort="none">
                        Valor
                        <button data-sort="value" class="table__sort-button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="table__sort-icon">
                                <path d="M12 15.0006L7.75732 10.758L9.17154 9.34375L12 12.1722L14.8284 9.34375L16.2426 10.758L12 15.0006Z"></path>
                            </svg>
                        </button>
                    </th>

                    <th class="table__header table__header--actions"></th>

                </tr>
            </thead>

            <tbody id="table-body" class="table__body">
                <!-- Injeção do JS para criar as linhas -->
            </tbody>

            <tfoot id="table-footer" class="table__foot">
                <tr class="table__row table__row--footer">
                    <th colspan="5" class="table__footer-label">Total Acumulado</th>
                    <th id="total-cell" class="table__footer-value"></th>
                </tr>
            </tfoot>
        </table>
    </section>

    <script type="module" src="app.js"></script>
</body>
</html>
