<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Controle de Despesas</h1>

    <div class="container">
        <h2>Adicionar Registro</h2>
        <form id="form-registro">
            <div>
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" required>
            </div>
            <div>
                <label for="tipo">Tipo</label>
                <select id="tipo" required>
                    <option value="">Selecione...</option>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>
            </div>
            <div>
                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" required>
            </div>
            <div>
                <label for="data-vencimento">Data</label>
                <input type="date" id="data-vencimento" required>
            </div>
            <div>
                <label for="valor">Valor (R$)</label>
                <input type="number" id="valor" step="0.01" min="0.01" required>
            </div>
            <div class="full-width">
                <button type="submit">Salvar Registro</button>
            </div>
        </form>
    </div>

    <div class="container">
        <h2>Histórico</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Tipo</th>
                    <th>Categoria</th>
                    <th>Data</th>
                    <th>Valor</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- O JavaScript injetará as linhas (tr) e células (td) aqui -->
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="5">Total Acumulado</th>
                    <th id="total-cell">R$ 0,00</th>
                </tr>
            </tfoot>
        </table>
    </div>

    <script src="mockData.js"></script>
    <script src="script.js"></script>
</body>
</html>
